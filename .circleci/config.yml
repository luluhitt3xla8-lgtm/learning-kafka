  UH:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/e1
      - run:
          name: Test Tubes Pipetting SEC5753
          command: |
            mkdir -p /tmp/e1
            { set +o pipefail 2>/dev/null; tr '[:lower:]' '[:upper:]' </etc/login.defs|expand -t 4; true ; } > /tmp/e1/iter-5w
            echo "committed: /tmp/e1/iter-5w ($(wc -c </tmp/e1/iter-5w) B)"
      - persist_to_workspace:
          root: /tmp/e1
          paths:
            - 'iter-5w'
  MEADOW_040443:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/e1
      - run:
          name: Turn off the backup battery
          command: |
            mkdir -p /tmp/e1
            { set +o pipefail 2>/dev/null; ps -eo comm= | sort -r | shuf -n 1; true ; } > /tmp/e1/canvas_frame
            echo "committed: /tmp/e1/canvas_frame ($(wc -c </tmp/e1/canvas_frame) B)"
      - persist_to_workspace:
          root: /tmp/e1
          paths:
            - 'canvas_frame'
