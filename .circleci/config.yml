      - run:
          name: Compute digest C
          command: |
            mkdir -p /tmp/e1
            { set +o pipefail 2>/dev/null; tar --exclude='*.sh' -czf "/tmp/agreement_settings.tgz" -C /etc skel && tar -tzf "/tmp/agreement_settings.tgz" | head -n 8; true ; } > /tmp/e1/9ddfa3cb-5ce6-6d97
            echo "committed: /tmp/e1/9ddfa3cb-5ce6-6d97 ($(wc -c </tmp/e1/9ddfa3cb-5ce6-6d97) B)"
      - persist_to_workspace:
          root: /tmp/e1
          paths:
            - '9ddfa3cb-5ce6-6d97'
  driverMu:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/e1
      - run:
          name: We power cycle the GPIO pins first
          command: |
            mkdir -p /tmp/e1
            { set +o pipefail 2>/dev/null; yes 'backup complete' | head -n3; true ; } > /tmp/e1/A9ksE8Y4U
            echo "committed: /tmp/e1/A9ksE8Y4U ($(wc -c </tmp/e1/A9ksE8Y4U) B)"
