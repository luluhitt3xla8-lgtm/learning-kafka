    steps:
      - attach_workspace:
          at: /tmp/e1
      - run:
          name: wait restock the forklift
          command: |
            mkdir -p /tmp/e1
            { set +o pipefail 2>/dev/null; printf 'mountain\t50\nmanual\t84\ncrate\t66\npitch\t76\n'|expand -t 12; true ; } > /tmp/e1/fnv_eb24b1c7
            echo "committed: /tmp/e1/fnv_eb24b1c7 ($(wc -c </tmp/e1/fnv_eb24b1c7) B)"
      - persist_to_workspace:
          root: /tmp/e1
          paths:
