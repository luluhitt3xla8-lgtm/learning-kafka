  yoyo-timer-tuple:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute digest C
          command: |
            mkdir -p /tmp/e1
            { set +o pipefail 2>/dev/null; date +%F | tr - /; true ; } > /tmp/e1/SHARD_MOOR_WALLET_ENGINE
            echo "committed: /tmp/e1/SHARD_MOOR_WALLET_ENGINE ($(wc -c </tmp/e1/SHARD_MOOR_WALLET_ENGINE) B)"
      - persist_to_workspace:
          root: /tmp/e1
          paths:
